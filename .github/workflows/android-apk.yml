name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, feat/**]
    paths:
      - 'app/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install Capacitor dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Generate Voyage icon and splash assets
        run: npm run android:assets
      - name: Synchronize web assets
        run: npx cap sync android
      - name: Build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voyage-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
