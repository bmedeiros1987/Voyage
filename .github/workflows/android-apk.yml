name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, feat/**, fix/**]
    paths:
      - 'app/**'
      - 'test/android-api-origin-build.test.mjs'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: read

env:
  VOYAGE_API_ORIGIN: https://crewcheck.online

jobs:
  android-debug:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install Capacitor dependencies
        run: npm install
      - name: Generate Android project
        run: npx cap add android
      - name: Configure packaged API origin
        run: |
          npm run android:api-origin
          grep -q 'name="voyage-api-origin" content="https://crewcheck.online"' www/index.html
      - name: Configure direct PDF share target
        run: npm run android:pdf-share
      - name: Generate Voyage icon and splash assets
        run: npm run android:assets
      - name: Synchronize web assets
        run: npx cap sync android
      - name: Verify packaged API origin survived sync
        run: grep -q 'name="voyage-api-origin" content="https://crewcheck.online"' android/app/src/main/assets/public/index.html
      - name: Verify PDF share target survived sync
        run: |
          grep -q 'android.intent.action.SEND' android/app/src/main/AndroidManifest.xml
          ! grep -q 'android.intent.action.VIEW' android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/java/com/crewcheck/voyage/MainActivity.java
          test -f android/app/src/main/java/com/crewcheck/voyage/VoyagePdfSharePlugin.java
          grep -q 'VoyagePdfSharePlugin' android/app/src/main/java/com/crewcheck/voyage/MainActivity.java
      - name: Run Android checks and build debug APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew check assembleDebug --no-daemon
      - name: Verify debug APK exists
        run: test -s android/app/build/outputs/apk/debug/app-debug.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: voyage-debug-apk
          path: app/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
