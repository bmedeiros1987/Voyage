name: Manus bridge self-check

on:
  pull_request:
    paths:
      - '.github/workflows/manus-github-audit.yml'
      - '.github/workflows/manus-bridge-selfcheck.yml'
      - 'scripts/validate_manus_bridge.py'
      - 'docs/MANUS_BRIDGE.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate bridge invariants
        run: python scripts/validate_manus_bridge.py
