name: Voyage Intelligence Foundation

on:
  push:
    branches:
      - 'feat/voyage-intelligence-foundation'
    paths:
      - 'src/ai/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/voyage-intelligence.yml'
  pull_request:
    paths:
      - 'src/ai/**'
      - 'tests/**'
      - 'package.json'
      - 'tsconfig.json'
      - '.github/workflows/voyage-intelligence.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm test
