name: Manus audit bridge

on:
  push:
    branches:
      - manus-audit-control
    paths:
      - .manus/audit-request.json

permissions:
  contents: read
  issues: write
  pull-requests: read
  checks: read

concurrency:
  group: manus-audit-control
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Resolve exact PR SHA and build private request
        id: request
        env:
          GH_TOKEN: ${{ github.token }}
          MANUS_GITHUB_CONNECTOR_ID: ${{ vars.MANUS_GITHUB_CONNECTOR_ID }}
          MANUS_PROJECT_ID: ${{ vars.MANUS_AUDIT_PROJECT_ID }}
        run: |
          set -euo pipefail
          test -n "$MANUS_GITHUB_CONNECTOR_ID"
          test -f .manus/audit-request.json

          PR_NUMBER="$(jq -er '.pr_number' .manus/audit-request.json)"
          REQUESTED_SHA="$(jq -er '.requested_sha' .manus/audit-request.json)"
          SCOPE="$(jq -r '.scope // "Independent exact-SHA audit."' .manus/audit-request.json)"
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]]

          PR_JSON="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER")"
          CURRENT_SHA="$(jq -r '.head.sha' <<<"$PR_JSON")"
          PR_STATE="$(jq -r '.state' <<<"$PR_JSON")"
          HEAD_REPO="$(jq -r '.head.repo.full_name' <<<"$PR_JSON")"

          test "$PR_STATE" = "open"
          test "$HEAD_REPO" = "${{ github.repository }}"
          test "$CURRENT_SHA" = "$REQUESTED_SHA" || {
            echo "stale control request: requested=$REQUESTED_SHA current=$CURRENT_SHA" >&2
            exit 22
          }

          PROMPT_FILE="$(mktemp)"
          cat > "$PROMPT_FILE" <<EOF
          [MANUS-AUTO-AUDIT]
          Repository: https://github.com/${{ github.repository }}
          PR: https://github.com/${{ github.repository }}/pull/$PR_NUMBER
          Audit ONLY exact immutable SHA: $REQUESTED_SHA

          Act as an independent READ-ONLY auditor. Do not commit, push, merge,
          rebase, force-push, modify application code/tests, or enable auto-merge.
          ChatGPT is the sole merge coordinator.

          Scope: $SCOPE

          Reproduce evidence independently from code, tests and GitHub Actions.
          Immediately before verdict, re-read the PR and confirm its HEAD is still
          $REQUESTED_SHA. A changed HEAD is stale and must never be approved.
          Return the requested structured output. MERGE requires zero reproducible
          P0/P1 blockers in scope. Always return the full 40-character SHA.
          EOF

          jq -n \
            --rawfile prompt "$PROMPT_FILE" \
            --arg connector_id "$MANUS_GITHUB_CONNECTOR_ID" \
            --arg project_id "$MANUS_PROJECT_ID" \
            --arg title "Voyage #$PR_NUMBER audit ${REQUESTED_SHA:0:12}" \
            '{message:{content:$prompt,connectors:[$connector_id]},title:$title,locale:"pt-BR",interactive_mode:false,hide_in_task_list:false,share_visibility:"private",agent_profile:"manus-1.6",project_id:(if $project_id == "" then null else $project_id end),structured_output_schema:{type:"object",properties:{verdict:{type:"string",enum:["MERGE","BLOCKER"]},sha:{type:"string"},severity:{type:"string",enum:["NONE","P0","P1","P2"]},summary:{type:"string"},reproducer:{type:"string"},expected:{type:"string"},actual:{type:"string"},root_cause:{type:"string"}},required:["verdict","sha","severity","summary","reproducer","expected","actual","root_cause"],additionalProperties:false}} | with_entries(select(.value != null))' > request.json

          echo "pr_number=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          echo "requested_sha=$REQUESTED_SHA" >> "$GITHUB_OUTPUT"

      - name: Create private Manus task
        id: create
        env:
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
        run: |
          set -euo pipefail
          test -n "$MANUS_API_KEY"
          response="$(curl --fail-with-body --silent --show-error \
            -X POST https://api.manus.ai/v2/task.create \
            -H 'Content-Type: application/json' \
            -H "x-manus-api-key: $MANUS_API_KEY" \
            --data-binary @request.json)"
          test "$(jq -r '.ok' <<<"$response")" = "true"
          test "$(jq -r '.share_visibility' <<<"$response")" = "private"
          TASK_ID="$(jq -r '.task_id' <<<"$response")"
          [[ "$TASK_ID" =~ ^[A-Za-z0-9_-]+$ ]]
          echo "task_id=$TASK_ID" >> "$GITHUB_OUTPUT"

      - name: Poll, validate and publish Manus verdict
        env:
          GH_TOKEN: ${{ github.token }}
          MANUS_API_KEY: ${{ secrets.MANUS_API_KEY }}
          TASK_ID: ${{ steps.create.outputs.task_id }}
          PR_NUMBER: ${{ steps.request.outputs.pr_number }}
          REQUESTED_SHA: ${{ steps.request.outputs.requested_sha }}
        run: |
          set -euo pipefail

          post_comment() {
            payload="$(jq -n --arg body "$1" '{body:$body}')"
            curl --fail-with-body --silent --show-error -X POST \
              "https://api.github.com/repos/${{ github.repository }}/issues/$PR_NUMBER/comments" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H 'Accept: application/vnd.github+json' \
              -H 'X-GitHub-Api-Version: 2022-11-28' \
              -H 'Content-Type: application/json' \
              --data-binary "$payload" >/dev/null
          }

          RESULT=""
          for attempt in $(seq 1 80); do
            response="$(curl --fail-with-body --silent --show-error --get \
              https://api.manus.ai/v2/task.listMessages \
              -H "x-manus-api-key: $MANUS_API_KEY" \
              --data-urlencode "task_id=$TASK_ID" \
              --data-urlencode 'order=desc' \
              --data-urlencode 'limit=50')"
            test "$(jq -r '.ok' <<<"$response")" = "true"
            status="$(jq -r '[.messages[] | select(.type=="status_update") | .status_update.agent_status][0] // "unknown"' <<<"$response")"
            test "$status" != "waiting" || { echo 'interactive Manus request refused' >&2; exit 23; }
            test "$status" != "error" || { echo 'Manus task error' >&2; exit 24; }
            RESULT="$(jq -c '[.messages[] | select(.type=="structured_output_result") | .structured_output_result][0] // empty' <<<"$response")"
            [ -z "$RESULT" ] || break
            sleep 15
          done
          [ -n "$RESULT" ]
          test "$(jq -r '.success' <<<"$RESULT")" = "true"

          verdict="$(jq -r '.value.verdict' <<<"$RESULT")"
          sha="$(jq -r '.value.sha' <<<"$RESULT")"
          severity="$(jq -r '.value.severity' <<<"$RESULT")"
          summary="$(jq -r '.value.summary' <<<"$RESULT")"
          test "$sha" = "$REQUESTED_SHA"

          current_sha="$(curl --fail-with-body --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${{ github.repository }}/pulls/$PR_NUMBER" | jq -r '.head.sha')"
          if [ "$current_sha" != "$REQUESTED_SHA" ]; then
            post_comment "[VOYAGE][MANUS→ALL][AUDIT RESULT]\n\nMANUS: STALE — requested $REQUESTED_SHA; current $current_sha"
            exit 0
          fi

          if [ "$verdict" = "MERGE" ]; then
            test "$severity" = "NONE"
            post_comment "[VOYAGE][MANUS→ALL][AUDIT RESULT]\n\nMANUS: MERGE — $REQUESTED_SHA\n\n$summary"
          else
            test "$verdict" = "BLOCKER"
            reproducer="$(jq -r '.value.reproducer' <<<"$RESULT")"
            expected="$(jq -r '.value.expected' <<<"$RESULT")"
            actual="$(jq -r '.value.actual' <<<"$RESULT")"
            root_cause="$(jq -r '.value.root_cause' <<<"$RESULT")"
            post_comment "[VOYAGE][MANUS→ALL][AUDIT RESULT]\n\nMANUS: BLOCKER — $REQUESTED_SHA\nSeverity: $severity\n\n$summary\n\nReproducer: $reproducer\nExpected: $expected\nActual: $actual\nRoot cause: $root_cause"
          fi
